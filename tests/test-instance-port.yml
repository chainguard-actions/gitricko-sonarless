name: Test with custom sonar-instance-port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          sonar-project-name: test-instance-port
          sonar-project-key: test-instance-port
          sonar-source-path: .
          sonar-metrics-path: sonar-metrics-port.json
          sonar-instance-port: "9300"
      - name: Assert metrics file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/sonar-metrics-port.json" ]; then
            echo "FAIL: sonar-metrics-port.json not found"
            exit 1
          fi
          echo "PASS: sonar-metrics-port.json exists"
          cat "$GITHUB_WORKSPACE/sonar-metrics-port.json"
