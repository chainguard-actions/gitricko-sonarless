name: Test sonar-metrics-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify sonar-metrics-path is declared in action.yml
        run: |
          ACTION_DIR="$GITHUB_WORKSPACE"
          if ! grep -q "sonar-metrics-path:" "$ACTION_DIR/action.yml"; then
            echo "FAIL: sonar-metrics-path not declared in action.yml"
            exit 1
          fi
          echo "PASS: sonar-metrics-path declared in action.yml"

      - name: Verify SONAR_METRICS_PATH is wired in action.yml
        run: |
          ACTION_DIR="$GITHUB_WORKSPACE"
          if ! grep -q "inputs.sonar-metrics-path" "$ACTION_DIR/action.yml"; then
            echo "FAIL: inputs.sonar-metrics-path not referenced in action.yml"
            exit 1
          fi
          echo "PASS: inputs.sonar-metrics-path is referenced in action.yml"

      - name: Verify makefile.sh uses SONAR_METRICS_PATH with a default
        run: |
          ACTION_DIR="$GITHUB_WORKSPACE"
          if ! grep -q 'SONAR_METRICS_PATH' "$ACTION_DIR/makefile.sh"; then
            echo "FAIL: SONAR_METRICS_PATH not found in makefile.sh"
            exit 1
          fi
          # Verify the default value is set
          if ! grep -q 'sonar-metrics.json' "$ACTION_DIR/makefile.sh"; then
            echo "FAIL: default sonar-metrics.json path not found in makefile.sh"
            exit 1
          fi
          echo "PASS: SONAR_METRICS_PATH with default found in makefile.sh"

      - name: Verify makefile.sh results function uses SONAR_METRICS_PATH
        run: |
          ACTION_DIR="$GITHUB_WORKSPACE"
          # Check that the results function writes to SONAR_METRICS_PATH
          if ! grep -A5 'function results()' "$ACTION_DIR/makefile.sh" | grep -q 'SONAR_METRICS_PATH'; then
            echo "FAIL: results() function does not use SONAR_METRICS_PATH"
            exit 1
          fi
          echo "PASS: results() function uses SONAR_METRICS_PATH"

      - name: Verify SONAR_METRICS_PATH env var is passed in action.yml scan step
        run: |
          ACTION_DIR="$GITHUB_WORKSPACE"
          # Confirm SONAR_METRICS_PATH is set as env var in action.yml
          if ! grep -q 'SONAR_METRICS_PATH' "$ACTION_DIR/action.yml"; then
            echo "FAIL: SONAR_METRICS_PATH env var not set in action.yml"
            exit 1
          fi
          echo "PASS: SONAR_METRICS_PATH env var is set in action.yml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          sonar-project-name: metrics-path-test
          sonar-project-key: metrics-path-test-key
          sonar-metrics-path: reports/sonar-metrics.json

      - name: Assert action was invoked with sonar-metrics-path input
        run: |
          echo "Action step completed (may have failed due to Docker/SonarQube infrastructure requirements)"
          echo "PASS: action step was invoked with sonar-metrics-path input"
