name: Test with custom sonar-metrics-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          sonar-project-name: test-metrics-path
          sonar-project-key: test-metrics-path
          sonar-source-path: .
          sonar-metrics-path: custom/metrics-output.json
          sonar-instance-port: "9234"
      - name: Assert custom metrics file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/custom/metrics-output.json" ]; then
            echo "FAIL: custom/metrics-output.json not found"
            exit 1
          fi
          echo "PASS: custom/metrics-output.json exists"
          cat "$GITHUB_WORKSPACE/custom/metrics-output.json"
